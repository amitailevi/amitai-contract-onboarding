<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>קליטת עובד</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2321;--mute:#6b7370;--line:#e7e4de;--accent:#2f6f5e;--accent-soft:#e6f0ec;--me:#2f6f5e;--me-ink:#fff;--warn:#b4532a}
@media (prefers-color-scheme:dark){:root{--bg:#121514;--card:#1b201e;--ink:#e9ecea;--mute:#98a29e;--line:#2a312e;--accent:#6fc2a8;--accent-soft:#1f2d28;--me:#3d8f78;--warn:#e08a5f}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Rubik,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:1fr minmax(0,320px);height:100dvh}
main{display:flex;flex-direction:column;min-width:0;height:100dvh}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600}
header b{display:block}header small{color:var(--mute)}
.bar{margin-inline-start:auto;width:120px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s}
#log{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.m{max-width:min(78%,560px);padding:11px 15px;border-radius:18px;line-height:1.55;white-space:pre-wrap;animation:in .25s ease}
.bot{background:var(--card);border:1px solid var(--line);border-start-start-radius:6px;align-self:flex-start}
.me{background:var(--me);color:var(--me-ink);border-start-end-radius:6px;align-self:flex-end}
.typing{display:flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%{opacity:.25}40%{opacity:1}}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.secure{align-self:flex-start;background:var(--accent-soft);border:1px solid var(--accent);border-radius:16px;padding:14px;display:grid;gap:8px;width:min(100%,360px)}
.secure label{font-size:.9rem;font-weight:500}.secure small{color:var(--mute)}
.secure .row{display:flex;gap:8px}.err{color:var(--warn);font-size:.85rem;min-height:1em}
form{display:flex;gap:10px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
input{flex:1;font:inherit;padding:12px 16px;border-radius:24px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none;min-width:0}
input:focus{border-color:var(--accent)}
button{font:inherit;font-weight:500;border:0;border-radius:24px;padding:0 20px;background:var(--accent);color:#fff;cursor:pointer}button:disabled{opacity:.5}
aside{border-inline-start:1px solid var(--line);background:var(--card);padding:20px;overflow-y:auto;height:100dvh}
aside h2{font-size:1rem;margin:0 0 4px}aside p{color:var(--mute);font-size:.85rem;margin:0 0 14px}
dl{margin:0;display:grid;gap:8px}dl div{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;border-bottom:1px dashed var(--line);padding-bottom:6px}dt{color:var(--mute)}dd{margin:0;text-align:end;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chips span{font-size:.8rem;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:99px}
.done{margin-top:16px;padding:14px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:500}
#toggle{display:none}
@media (max-width:820px){body{grid-template-columns:1fr}aside{position:fixed;inset:auto 0 0 0;height:70dvh;transform:translateY(100%);transition:transform .3s;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px #0003;z-index:5}aside.open{transform:none}#toggle{display:block;background:var(--accent-soft);color:var(--accent);padding:8px 14px;font-size:.85rem;margin-inline-start:8px}.bar{width:70px}}
</style>
</head>
<body>
<main>
  <header><div class="av">מ</div><div><b>מירי · קליטת עובדים</b><small id="org">מחוברת</small></div><div class="bar"><i id="prog"></i></div><button id="toggle" type="button">הפרטים שלי</button></header>
  <div id="log" aria-live="polite"></div>
  <form id="f"><input id="t" placeholder="כתבו כאן…" autocomplete="off" disabled><button id="s" disabled>שליחה</button></form>
</main>
<aside id="side"><h2>מה אספנו עד עכשיו</h2><p>מתעדכן בזמן אמת. מספרים רגישים מוצגים רק כ״התקבל״.</p><dl id="rows"></dl><div class="chips" id="chips"></div><div id="fin"></div></aside>
<script>
const $=s=>document.querySelector(s),log=$('#log');let sid=null,total=20;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const add=(cls,html)=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;log.append(d);log.scrollTop=log.scrollHeight;return d};
const busy=on=>{$('#t').disabled=$('#s').disabled=on;if(on)return add('m bot typing','<i></i><i></i><i></i>');document.querySelector('.typing')?.remove();$('#t').focus()};
async function api(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return r.json()}
function render(st){
  $('#rows').innerHTML=st.rows.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');
  $('#chips').innerHTML=st.credits.map(c=>`<span>${esc(c)}</span>`).join('');
  total=Math.max(total,st.rows.length+st.missing.length);$('#prog').style.width=(st.done?100:Math.round(st.rows.length/total*100))+'%';
  $('#fin').innerHTML=st.done?'<div class="done">✓ כל הפרטים נקלטו. תודה!</div>':'';
  document.querySelector('.secure')?.remove();
  if(st.widget){const w=add('secure',`<label>🔒 ${esc(st.widget.label)}</label><small>נשמר במערכת בלבד, לא נשלח לצ׳אט</small><div class="row"><input inputmode="numeric" autocomplete="off"><button>אישור</button></div><div class="err"></div>`);
    const i=w.querySelector('input'),go=async()=>{if(!i.value.trim())return;w.querySelector('button').disabled=true;const tp=busy(true);const r=await api('/api/secure',{sid,field:st.widget.field,value:i.value});busy(false);
      if(r.error){w.querySelector('.err').textContent=r.error;w.querySelector('button').disabled=false;return}handle(r)};
    w.querySelector('button').onclick=go;i.onkeydown=e=>e.key==='Enter'&&go();setTimeout(()=>i.focus(),50)}
  if(st.done)$('#t').disabled=$('#s').disabled=true;
}
function handle(r){if(r.error&&!r.state)return add('m bot',esc(r.error));if(r.reply)add('m bot',esc(r.reply));if(r.state)render(r.state)}
$('#f').onsubmit=async e=>{e.preventDefault();const t=$('#t').value.trim();if(!t)return;$('#t').value='';add('m me',esc(t));busy(true);try{handle(await api('/api/chat',{sid,text:t}))}finally{busy(false)}};
$('#toggle').onclick=()=>$('#side').classList.toggle('open');
(async()=>{busy(true);try{const r=await api('/api/start',{});sid=r.sid;handle(r)}catch{add('m bot','לא הצלחתי להתחבר. רעננו את הדף.')}finally{busy(false)}})();
</script>
</body>
</html>
